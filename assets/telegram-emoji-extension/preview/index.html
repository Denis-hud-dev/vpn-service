<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KudaVPN emoji extension</title><style>body{background:#070f19;color:#d9f7ff;font:16px system-ui;margin:28px}h1{color:#55d6ff}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}article{border:1px solid #315165;border-radius:16px;padding:16px;text-align:center}video{width:100px;height:100px}button{background:#111a22;color:#55d6ff;border:1px solid #315165;border-radius:8px;padding:10px}body.light{background:#e6eef3;color:#111a22}@media(prefers-reduced-motion:reduce){video{display:none}article{background-image:var(--poster);background-repeat:no-repeat;background-position:top center;padding-top:110px}}</style><h1>KudaVPN / Quiet Current</h1><p>16 new VP9 animations + 2 unchanged reused files. Click any animation to pause/play.</p><button id="theme">Light / dark preview</button><main><article><video autoplay loop muted playsinline src="../reused-existing/buy_vpn.webm"></video><p>buy_vpn / existing</p></article><article><video autoplay loop muted playsinline src="../new-webm/info.webm"></video><p>info</p></article><article><video autoplay loop muted playsinline src="../new-webm/settings.webm"></video><p>settings</p></article><article><video autoplay loop muted playsinline src="../new-webm/apple.webm"></video><p>apple</p></article><article><video autoplay loop muted playsinline src="../new-webm/windows.webm"></video><p>windows</p></article><article><video autoplay loop muted playsinline src="../new-webm/android.webm"></video><p>android</p></article><article><video autoplay loop muted playsinline src="../new-webm/linux.webm"></video><p>linux</p></article><article><video autoplay loop muted playsinline src="../new-webm/ios.webm"></video><p>ios</p></article><article><video autoplay loop muted playsinline src="../new-webm/macos.webm"></video><p>macos</p></article><article><video autoplay loop muted playsinline src="../new-webm/smart_tv.webm"></video><p>smart_tv</p></article><article><video autoplay loop muted playsinline src="../new-webm/promo.webm"></video><p>promo</p></article><article><video autoplay loop muted playsinline src="../new-webm/referral.webm"></video><p>referral</p></article><article><video autoplay loop muted playsinline src="../new-webm/channel.webm"></video><p>channel</p></article><article><video autoplay loop muted playsinline src="../new-webm/community.webm"></video><p>community</p></article><article><video autoplay loop muted playsinline src="../new-webm/notification.webm"></video><p>notification</p></article><article><video autoplay loop muted playsinline src="../new-webm/back.webm"></video><p>back</p></article><article><video autoplay loop muted playsinline src="../new-webm/home.webm"></video><p>home</p></article><article><video autoplay loop muted playsinline src="../reused-existing/faq.webm"></video><p>faq / existing</p></article></main><script>document.querySelector('#theme').onclick=()=>document.body.classList.toggle('light');for(const v of document.querySelectorAll('video')){v.onclick=()=>v.paused?v.play():v.pause();v.parentElement.style.setProperty('--poster',`url(../png/${v.getAttribute('src').split('/').pop().replace('.webm','.png')})`);if(matchMedia('(prefers-reduced-motion:reduce)').matches)v.pause()}</script></html>
